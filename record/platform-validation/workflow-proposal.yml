# Install as .github/workflows/lock-platform-validation.yml after workflow permission is available.
name: Lock platform validation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Consume archived locks, or regenerate with the published RPC runtime
        type: choice
        options: [consume, generate]
        default: consume
permissions:
  contents: read
jobs:
  locks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        case:
          - paulmillr-noble-hashes-npm
          - unjs-pathe-pnpm
          - immerjs-immer-yarn
          - oven-sh-setup-bun-bun
          - react-icons__react-icons
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: inputs.mode == 'generate'
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve published runtime
        if: inputs.mode == 'generate'
        shell: bash
        env:
          CODEGENOME_USERNAME: ${{ secrets.CODEGENOME_USERNAME }}
          CODEGENOME_TOKEN: ${{ secrets.CODEGENOME_TOKEN }}
        run: python record/platform-validation/bootstrap.py "$RUNNER_TEMP/lock-runtime"
      - name: Validate pinned checkout
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx1536m
        run: node record/platform-validation/run.mjs '${{ inputs.mode }}' '${{ matrix.case }}' "$RUNNER_TEMP/lock-case"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: locks-${{ inputs.mode }}-${{ matrix.os }}-${{ matrix.case }}
          path: ${{ runner.temp }}/lock-case/evidence
          if-no-files-found: warn
